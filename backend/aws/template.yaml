AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CornerTasks BYO-AWS backend. Iteration 5 lands real push/pull plus the
  DID-Auth → Bearer JWT flow described in docs/sync-protocol.md §8.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]*$'
  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  JwtAlg:
    Type: String
    Default: EdDSA
    AllowedValues: [EdDSA, HS256]
    Description: Algorithm for the server-issued bearer JWT. EdDSA is the
      default (per-deploy Ed25519 keypair); HS256 uses a shared secret. Both
      keys live in SSM Parameter Store under /cornertasks/<stage>/.
  AccessTokenTtlSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 86400
    Description: Lifetime of the bearer JWT issued by /v1/auth/token.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        EVENTS_TABLE: !Ref EventsTable
        AUTH_CHALLENGES_TABLE: !Ref AuthChallengesTable
        JWT_ALG: !Ref JwtAlg
        ACCESS_TOKEN_TTL_S: !Ref AccessTokenTtlSeconds
        JWT_PRIVATE_SSM_PARAM: !Sub /cornertasks/${Stage}/jwt-signing-key
        JWT_PUBLIC_SSM_PARAM: !Sub /cornertasks/${Stage}/jwt-signing-key-public
        JWT_SECRET_SSM_PARAM: !Sub /cornertasks/${Stage}/jwt-hs256-secret

Resources:

  # --- Data ----------------------------------------------------------------

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cornertasks-${Stage}-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: seq
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Pull cursor index. `seq` is a server-assigned monotonic per-account
        # sequence number; clients pass an opaque numeric cursor and the
        # handler queries `seq > :cursor` against this GSI.
        - IndexName: BySeq
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: seq
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuthChallengesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cornertasks-${Stage}-auth-challenges
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- API + Lambdas -------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cornertasks-${Stage}-push
      CodeUri: ./
      Handler: push.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref EventsTable }
        - !Ref JwtSigningReadPolicy
      Events:
        Push:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/sync/push
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node20
        Sourcemap: true
        External: ["@aws-sdk/client-dynamodb", "@aws-sdk/lib-dynamodb", "@aws-sdk/client-ssm"]
        EntryPoints: [src/handlers/push.ts]

  PullFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cornertasks-${Stage}-pull
      CodeUri: ./
      Handler: pull.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EventsTable }
        - !Ref JwtSigningReadPolicy
      Events:
        Pull:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/sync/pull
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node20
        Sourcemap: true
        External: ["@aws-sdk/client-dynamodb", "@aws-sdk/lib-dynamodb", "@aws-sdk/client-ssm"]
        EntryPoints: [src/handlers/pull.ts]

  AuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cornertasks-${Stage}-auth-challenge
      CodeUri: ./
      Handler: challenge.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuthChallengesTable }
      Events:
        AuthChallenge:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/auth/challenge
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node20
        Sourcemap: true
        External: ["@aws-sdk/client-dynamodb", "@aws-sdk/lib-dynamodb", "@aws-sdk/client-ssm"]
        EntryPoints: [src/handlers/auth/challenge.ts]

  AuthTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cornertasks-${Stage}-auth-token
      CodeUri: ./
      Handler: token.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuthChallengesTable }
        - !Ref JwtSigningReadPolicy
      Events:
        AuthToken:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/auth/token
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node20
        Sourcemap: true
        External: ["@aws-sdk/client-dynamodb", "@aws-sdk/lib-dynamodb", "@aws-sdk/client-ssm"]
        EntryPoints: [src/handlers/auth/token.ts]

  JwtSigningReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      # No ManagedPolicyName — letting CloudFormation auto-generate it keeps
      # the deploy on CAPABILITY_IAM (named IAM resources would force the
      # operator to redeploy with CAPABILITY_NAMED_IAM).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cornertasks/${Stage}/jwt-signing-key
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cornertasks/${Stage}/jwt-signing-key-public
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cornertasks/${Stage}/jwt-hs256-secret

  # --- Web hosting (private S3 + CloudFront with OAC) ---------------------

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cornertasks-${Stage}-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub cornertasks-${Stage}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: !Ref CloudFrontPriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: webBucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: webBucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Description: Base URL for the sync API. Paste into the app's Cloud Sync
      settings.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  WebUrl:
    Description: CloudFront URL for the web app. Returns 404 until iteration 6
      ships and `npm run deploy:web` uploads a build.
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  EventsTableName:
    Value: !Ref EventsTable
  AuthChallengesTableName:
    Value: !Ref AuthChallengesTable
  JwtSigningKeyParam:
    Description: SSM parameter name for the EdDSA private signing key.
      Generate it once with `npm run init-signing-key` (see backend/aws/README.md).
    Value: !Sub /cornertasks/${Stage}/jwt-signing-key
