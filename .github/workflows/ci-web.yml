name: CI (apps/web)

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/ci-web.yml'

# Opt in to Node.js 24 for JS-based actions ahead of the 2026-06-02
# default flip; silences the deprecation warning without bumping every
# `actions/*@v4` pin. Drop once the actions ship v5 across the board.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
