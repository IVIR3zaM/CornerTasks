name: CI (apps/macos)

on:
  pull_request:
  push:
    branches: [main]

# Opt in to Node.js 24 for JS-based actions ahead of the 2026-06-02
# default flip; silences the deprecation warning without bumping every
# `actions/*@v4` pin. Drop once the actions ship v5 across the board.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: swift build
        run: swift build -c debug
      - name: swift test
        run: swift test
