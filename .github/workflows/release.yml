name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Skip leading v.'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build universal DMG
        env:
          UNIVERSAL: '1'
          VERSION: ${{ steps.ver.outputs.version }}
          DMG_NAME: CornerTasks-${{ steps.ver.outputs.version }}-universal.dmg
        run: ./build.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CornerTasks-${{ steps.ver.outputs.version }}-universal
          path: release/CornerTasks-${{ steps.ver.outputs.version }}-universal.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CornerTasks ${{ github.ref_name }}
          generate_release_notes: true
          files: release/CornerTasks-${{ steps.ver.outputs.version }}-universal.dmg
          body: |
            Universal macOS build (Apple Silicon + Intel), macOS 13+.

            The DMG is ad-hoc signed (not notarized). On first launch macOS
            Gatekeeper may show a warning — right-click the app and choose
            **Open**, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/CornerTasks.app
            ```
