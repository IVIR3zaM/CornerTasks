# Release the macOS app: build a universal DMG and attach it to a GitHub
# release.
#
# Triggers:
#   - push of a `macos-v*` tag   → standalone hotfix release of this component.
#   - workflow_call              → invoked by `release-all.yml` for a `v*` umbrella.
#   - workflow_dispatch          → manual override.
#
# (Note: bare `v*` tags are handled by `release-all.yml`, which calls this
# workflow via workflow_call. Don't add `v*` to the tag list here or you'll
# double-trigger.)
#
# Gate: skipped entirely if the repo variable RELEASE_MACOS_ENABLED is
# explicitly set to 'false'. Unset / 'true' / anything else = enabled.
#
# This workflow uses no AWS credentials.
name: Release macOS

on:
  push:
    tags:
      - 'macos-v*'
  workflow_call:
    inputs:
      version:
        description: 'Version (e.g. 0.3.0). Skip leading v.'
        required: true
        type: string
      release_tag:
        description: 'GitHub release tag to attach to (e.g. v0.3.0 or macos-v0.2.1).'
        required: true
        type: string
      attach_release:
        description: 'Attach the DMG to the GitHub release after a successful build. The umbrella sets this to false and downloads the DMG artifact in its finalize step instead.'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.3.0). Skip leading v.'
        required: true

permissions:
  contents: write

jobs:
  build:
    if: vars.RELEASE_MACOS_ENABLED != 'false'
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version + release tag
        id: ver
        env:
          # `github.event_name` reflects the *caller's* trigger inside a
          # reusable workflow (e.g. `push` when the umbrella invokes us),
          # so we discriminate on whether the umbrella-only `release_tag`
          # input was actually passed.
          IN_VERSION:     ${{ inputs.version }}
          IN_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$IN_RELEASE_TAG" ]; then
            # workflow_call (umbrella)
            v="$IN_VERSION"
            tag="$IN_RELEASE_TAG"
          elif [ -n "$IN_VERSION" ]; then
            # workflow_dispatch
            v="$IN_VERSION"
            tag="macos-v$v"
          else
            # push of macos-v* tag
            tag="${GITHUB_REF_NAME}"
            v="${tag#macos-v}"
          fi
          echo "version=$v"        >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag"  >> "$GITHUB_OUTPUT"
          echo "Building macOS $v → GitHub release $tag"

      - name: Build universal DMG
        working-directory: apps/macos
        env:
          UNIVERSAL: '1'
          VERSION: ${{ steps.ver.outputs.version }}
          DMG_NAME: CornerTasks-${{ steps.ver.outputs.version }}-universal.dmg
        run: ./build.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CornerTasks-${{ steps.ver.outputs.version }}-universal
          path: apps/macos/release/CornerTasks-${{ steps.ver.outputs.version }}-universal.dmg

      - name: Attach DMG to GitHub release
        # Skip when the umbrella will finalize the release (it passes
        # `release_tag` and `attach_release: false`); standalone tag pushes
        # and dispatches leave `release_tag` empty so this still attaches.
        if: ${{ inputs.release_tag == '' || inputs.attach_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: CornerTasks ${{ steps.ver.outputs.release_tag }}
          files: apps/macos/release/CornerTasks-${{ steps.ver.outputs.version }}-universal.dmg
          append_body: true
          generate_release_notes: false
          body: |
            **macOS v${{ steps.ver.outputs.version }}**

            Universal macOS build (Apple Silicon + Intel), macOS 13+.

            The DMG is ad-hoc signed (not notarized). On first launch macOS
            Gatekeeper may show a warning — right-click the app and choose
            **Open**, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/CornerTasks.app
            ```
