name: CI (backend/aws)

on:
  pull_request:
    paths:
      - 'backend/aws/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/aws/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/aws/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
