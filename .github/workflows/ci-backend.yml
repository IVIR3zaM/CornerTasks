name: CI (backend/aws)

on:
  pull_request:
    paths:
      - 'backend/aws/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/aws/**'
      - '.github/workflows/ci-backend.yml'

# Opt in to Node.js 24 for JS-based actions ahead of the 2026-06-02
# default flip; silences the deprecation warning without bumping every
# `actions/*@v4` pin. Drop once the actions ship v5 across the board.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/aws
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/aws/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
