name: CI (design/)

on:
  pull_request:
  push:
    branches: [main]

# Opt in to Node.js 24 for JS-based actions ahead of the 2026-06-02
# default flip; silences the deprecation warning without bumping every
# `actions/*@v4` pin. Drop once the actions ship v5 across the board.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Zero-deps validator; no npm install needed.
      - run: node design/tools/validate/validate.mjs

      # Regenerate the static HTML previewer so every CI run has a fresh
      # reference artifact reviewers can download.
      - run: node design/tools/preview/generate.mjs

      - name: Upload design preview
        uses: actions/upload-artifact@v4
        with:
          name: design-preview
          path: design/preview/index.html
          if-no-files-found: error
          retention-days: 90
